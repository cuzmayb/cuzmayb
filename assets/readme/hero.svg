<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">cuzmayb: Hyojun Jung, semiconductor packaging</title>
  <desc id="d">A stack of four dies, one per project: HBM void inspection, GPU-HBM signal integrity, TGV copper fill, ALD and ALE. Next to it the name cuzmayb and Hyojun Jung.</desc>
  <rect width="1200" height="360" rx="20" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#dfe2e8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <text x="80" y="150" font-size="84" font-weight="700" letter-spacing="-3" fill="#13213c">cuzmayb</text>
    <text x="82" y="204" font-size="30" font-weight="600" fill="#13213c">정효준 Hyojun Jung</text>
    <text x="82" y="248" font-size="22" fill="#5b6478">Semiconductor packaging · materials &amp; process</text>
    <text x="82" y="282" font-size="20" fill="#5b6478">Hanyang Univ. ERICA · Feb 2027</text>
  </g>

  <!-- stacked-die mark from the site, one die per project, newest on top -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="802" y="66" width="236" height="48" rx="10" fill="#efc3ca"/>
    <text x="920" y="97" fill="#13213c">HBM void · Zth(t)</text>
    <rect x="776" y="126" width="288" height="48" rx="10" fill="#e48a98"/>
    <text x="920" y="157" fill="#13213c">GPU-HBM SI · HFSS</text>
    <rect x="750" y="186" width="340" height="48" rx="10" fill="#d4384f"/>
    <text x="920" y="217" fill="#ffffff">TGV Cu fill · 12 → 11 h</text>
    <rect x="724" y="246" width="392" height="48" rx="10" fill="#c8102e"/>
    <text x="920" y="277" fill="#ffffff">ALD / ALE · TSV</text>
  </g>
  <rect x="704" y="306" width="432" height="6" rx="3" fill="#13213c"/>
</svg>
